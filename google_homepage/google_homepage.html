<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'arial', sans-serif; }
    </style>
</head>
<body class="flex flex-col min-h-screen text-[14px] text-[#202124] bg-white">

    <div class="flex items-center justify-between px-4 py-2 border-b border-gray-200">
        <div class="flex items-center space-x-3">
            <img src="https://www.google.com/chrome/static/images/chrome-logo.svg" class="w-5 h-5" alt="Chrome">
            <span class="text-sm text-[#3c4043]">Google Chrome isn't your default browser</span>
            <button class="bg-[#1a73e8] text-white px-5 py-1.5 rounded-full font-medium text-sm hover:bg-blue-700 transition-colors">
                Set as default
            </button>
        </div>
        <button class="text-gray-500 hover:text-black text-2xl px-2">&times;</button>
    </div>

    <header class="flex justify-end items-center p-4 space-x-1">
        <div class="flex items-center space-x-4 mr-2">
            <a href="#" class="text-[13px] hover:underline">Gmail</a>
            <a href="#" class="text-[13px] hover:underline">Images</a>
        </div>
        
        <button class="p-2 hover:bg-gray-100 rounded-full transition-colors">
            <svg class="w-6 h-6 fill-[#5f6368]" viewBox="0 0 24 24"><path d="M20.84 17.41l-5.22-7.31V5h.62c.41 0 .75-.34.75-.75s-.34-.75-.75-.75H7.75c-.41 0-.75.34-.75.75s.34.75.75.75h.62v5.1L3.16 17.41C2.56 18.25 3.16 19.5 4.19 19.5h15.63c1.02 0 1.62-1.25 1.02-2.09zM5.49 18l4.13-5.78V5h4.76v7.22L18.51 18H5.49z"></path></svg>
        </button>

        <button class="p-2 hover:bg-gray-100 rounded-full transition-colors">
            <svg class="w-6 h-6 fill-[#5f6368]" viewBox="0 0 24 24"><path d="M6,8c1.1,0 2,-0.9 2,-2s-0.9,-2 -2,-2 -2,0.9 -2,2 0.9,2 2,2zM12,20c1.1,0 2,-0.9 2,-2s-0.9,-2 -2,-2 -2,0.9 -2,2 0.9,2 2,2zM6,20c1.1,0 2,-0.9 2,-2s-0.9,-2 -2,-2 -2,0.9 -2,2 0.9,2 2,2zM6,14c1.1,0 2,-0.9 2,-2s-0.9,-2 -2,-2 -2,0.9 -2,2 0.9,2 2,2zM12,14c1.1,0 2,-0.9 2,-2s-0.9,-2 -2,-2 -2,0.9 -2,2 0.9,2 2,2zM16,6c0,1.1 0.9,2 2,2s2,-0.9 2,-2 -0.9,-2 -2,-2 -2,0.9 -2,2zM12,8c1.1,0 2,-0.9 2,-2s-0.9,-2 -2,-2 -2,0.9 -2,2 0.9,2 2,2zM18,14c1.1,0 2,-0.9 2,-2s-0.9,-2 -2,-2 -2,0.9 -2,2 0.9,2 2,2zM18,20c1.1,0 2,-0.9 2,-2s-0.9,-2 -2,-2 -2,0.9 -2,2 0.9,2 2,2z"></path></svg>
        </button>

        <div class="pl-2">
            <div class="w-8 h-8 rounded-full bg-[#c0392b] text-white flex items-center justify-center font-medium cursor-pointer text-sm">C</div>
        </div>
    </header>

    <main class="flex-grow flex flex-col items-center pt-8">
        <div class="flex items-center mb-6 relative">
            <img src="https://google.com/logos/doodles/2026/ski-jumping-2026-6753651837111050-law.gif" alt="Google" class="w-[330px]">
            <div class="absolute -right-12 bottom-4">
                <button class="p-2 hover:bg-gray-100 rounded-full border border-gray-100 transition-colors">
                    <svg class="w-4 h-4 fill-[#70757a]" viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92c0-1.61-1.31-2.92-2.92-2.92z"></path></svg>
                </button>
            </div>
        </div>

        <div class="flex items-center border border-[#dfe1e5] hover:shadow-md focus-within:shadow-md rounded-full w-[584px] px-4 py-2 mt-2 transition-shadow group">
            <svg class="w-5 h-5 fill-gray-400 mr-3" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"></path></svg>
            
            <input type="text" class="flex-grow focus:outline-none text-base" value="">
            
            <div class="flex items-center space-x-4">
                <svg class="w-5 h-5 cursor-pointer" viewBox="0 0 24 24"><path fill="#4285f4" d="m12 15c1.66 0 3-1.31 3-2.97v-7.02c0-1.66-1.34-3.01-3-3.01s-3 1.34-3 3.01v7.02c0 1.66 1.34 2.97 3 2.97z"></path><path fill="#34a853" d="m11 18.08h2v3.92h-2z"></path><path fill="#fbbc05" d="m7.05 16.87c-1.27-1.33-2.05-2.83-2.05-4.87h2c0 1.45 0.56 2.42 1.47 3.38v0.32l-1.15 1.18z"></path><path fill="#ea4335" d="m12 16.93a4.97 5.25 0 0 1 -3.54 -1.55l-1.41 1.49c1.26 1.34 3.02 2.13 4.95 2.13 3.87 0 6.99-2.92 6.99-7h-2c0 2.92-2.24 4.93-4.99 4.93z"></path></svg>
                <svg class="w-5 h-5 cursor-pointer" viewBox="0 0 192 192"><path fill="#4285f4" d="M36.46 68.22a31.76 31.76 0 0 1 31.76-31.76h26.47v-15.88h-26.47a47.65 47.65 0 0 0-47.65 47.64v26.47h15.88v-26.47z"></path><path fill="#ea4335" d="M155.54 68.22a31.76 31.76 0 0 0-31.76-31.76h-26.47v-15.88h26.47a47.65 47.65 0 0 1 47.65 47.64v26.47h-15.88v-26.47z"></path><path fill="#fbbc04" d="M36.46 123.78a31.76 31.76 0 0 0 31.76 31.76h26.47v15.88h-26.47a47.65 47.65 0 0 1-47.65-47.64v-26.47h15.88v26.47z"></path><path fill="#34a853" d="M123.78 155.54a31.76 31.76 0 0 0 31.76-31.76v-26.47h15.88v26.47a47.65 47.65 0 0 1-47.65 47.64h-26.47v-15.88h26.47z"></path><circle fill="#4285f4" cx="96" cy="96" r="18.53"></circle><circle fill="#34a853" cx="138.35" cy="138.35" r="10.59"></circle></svg>
            </div>
        </div>

        <div class="mt-7 flex space-x-3">
            <button class="bg-[#f8f9fa] text-[#3c4043] px-4 py-2 rounded hover:shadow-sm hover:border-gray-300 border border-transparent transition-all">Google Search</button>
            <button class="bg-[#f8f9fa] text-[#3c4043] px-4 py-2 rounded hover:shadow-sm hover:border-gray-300 border border-transparent transition-all">I'm Feeling Lucky</button>
        </div>

        <div class="mt-6 text-[13px] text-[#4d5156]">
            Google offered in: 
            <a href="#" class="text-[#1a0dab] hover:underline ml-1">Filipino</a> 
            <a href="#" class="text-[#1a0dab] hover:underline ml-2">Cebuano</a>
        </div>
    </main>

    <footer class="bg-[#f2f2f2] text-[#70757a] text-[14px]">
        <div class="px-8 py-3 border-b border-gray-300">Philippines</div>
        <div class="px-8 py-3 flex flex-wrap justify-between">
            <div class="flex space-x-7">
                <a href="#" class="hover:underline">About</a>
                <a href="#" class="hover:underline">Advertising</a>
                <a href="#" class="hover:underline">Business</a>
                <a href="#" class="hover:underline">How Search works</a>
            </div>
            <div class="flex space-x-7">
                <a href="#" class="hover:underline">Privacy</a>
                <a href="#" class="hover:underline">Terms</a>
                <a href="#" class="hover:underline">Settings</a>
            </div>
        </div>
    </footer>

</body>
</html>
