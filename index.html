<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Merian | Frontend Developer</title>
  <link rel="icon" type="image/png" href="images/favicon.png">

  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#5B2D8B',
            accent: '#F4C430',
            bgmain: '#cabfe0',
            textgray: '#555555'
          },
          fontFamily: {
            poppins: ['Poppins', 'sans-serif']
          }
        }
      }
    }
  </script>

  <style>
    html {
      scroll-behavior: smooth;
    }
  </style>
</head>

<body class="bg-bgmain min-h-screen font-poppins">

  <header class="bg-white/80 backdrop-blur-xl m-6 px-6 py-6 rounded-2xl shadow-lg">
    <div class="flex flex-wrap items-center justify-between gap-5">

      <!-- LOGO -->
      <h2 class="text-primary text-xl font-bold">Merian</h2>

      <!-- NAV LINKS (duol sa button) -->
      <nav class="flex flex-wrap gap-x-10 font-l ml-auto">
        <a href="#"
          class="text-primary border-b-2 border-yellow-400 pb-1 hover:text-purple-800 hover:border-yellow-400 transition-all duration-300">
          Home
        </a>
        <a href="#"
          class="pb-1 hover:text-purple-800 hover:border-yellow-400 transition-all duration-300 border-b-2 border-transparent">
          About
        </a>
        <a href="#"
          class="pb-1 hover:text-purple-800 hover:border-yellow-400 transition-all duration-300 border-b-2 border-transparent">
          Services
        </a>
        <a href="#"
          class="pb-1 hover:text-purple-800 hover:border-yellow-400 transition-all duration-300 border-b-2 border-transparent">
          Portfolio
        </a>
        <a href="#"
          class="pb-1 hover:text-purple-800 hover:border-yellow-400 transition-all duration-300 border-b-2 border-transparent">
          Blog
        </a>
        <button onclick="openModal()"
          class="pb-1 hover:text-purple-800 hover:border-yellow-400 transition-all duration-300 border-b-2 border-transparent">
          Contact
        </button>
      </nav>

      <!-- BUTTON RIGHT -->
      <button
        class="bg-gradient-to-r from-primary to-purple-600 text-white px-5 py-2 rounded-full hover:scale-105 transition shadow-md ml-4">
        Let’s chat
      </button>

    </div>
  </header>

  <!-- HERO -->
  <section
    class="bg-white/60 backdrop-blur-xl m-6 px-14 py-16 rounded-3xl flex flex-wrap items-center justify-between gap-x-20 min-h-[80vh]">
    <div class="max-w-2xl space-y-7">
      <span class="text-sm tracking-[0.25em] text-textgray font-semibold uppercase">WELCOME TO MY WORLD</span>

      <h1 class="text-6xl md:text-7xl font-bold leading-[1.1]">
        Hi, I'm
        <span class="bg-gradient-to-r from-primary to-accent bg-clip-text text-transparent">
          Merian
        </span>
      </h1>

      <h2 class="text-accent font-bold text-2xl md:text-3xl tracking-wide">Frontend Developer</h2>

      <p class="text-textgray leading-relaxed text-lg md:text-xl max-w-xl">
        I design and build modern, responsive, and user-friendly
        web interfaces with clean code and smooth animations.
      </p>

      <div class="flex gap-6 pt-4">
        <button
          class="bg-gradient-to-r from-primary to-purple-600 text-white px-10 py-5 text-lg font-semibold rounded-xl hover:scale-105 hover:shadow-xl transition-all duration-300">
          Hire Me Now
        </button>

        <button
          class="border-2 border-primary text-primary px-10 py-5 text-lg font-semibold rounded-xl hover:bg-primary hover:text-white hover:scale-105 transition-all duration-300">
          Download CV
        </button>
      </div>

      <!-- SOCIALS -->
      <div class="flex gap-6 pt-8">
        <a class="w-14 h-14 flex items-center justify-center rounded-full border-2 border-primary text-primary text-xl hover:bg-black hover:text-white hover:scale-110 hover:shadow-lg transition-all duration-300"
          href="https://www.tiktok.com/@merianfelizarta" target="_blank">
          <i class="fa-brands fa-tiktok"></i>
        </a>

        <a class="w-14 h-14 flex items-center justify-center rounded-full border-2 border-primary text-primary text-xl hover:bg-pink-600 hover:text-white hover:scale-110 hover:shadow-lg transition-all duration-300"
          href="https://www.instagram.com/@yanny122504" target="_blank">
          <i class="fa-brands fa-instagram"></i>
        </a>

        <a class="w-14 h-14 flex items-center justify-center rounded-full border-2 border-primary text-primary text-xl hover:bg-blue-600 hover:text-white hover:scale-110 hover:shadow-lg transition-all duration-300"
          href="https://www.facebook.com/@ms.yannie25" target="_blank">
          <i class="fa-brands fa-facebook-f"></i>
        </a>

        <a class="w-14 h-14 flex items-center justify-center rounded-full border-2 border-primary text-primary text-xl hover:bg-red-600 hover:text-white hover:scale-110 hover:shadow-lg transition-all duration-300"
          href="https://www.youtube.com/@MerianFelizarta" target="_blank">
          <i class="fa-brands fa-youtube"></i>
        </a>
      </div>
    </div>

    <!-- IMAGE -->
    <div class="flex justify-center mt-10 md:mt-0">
      <div
        class="w-[350px] h-[350px] lg:w-[420px] lg:h-[420px] rounded-full p-3 bg-gradient-to-br from-primary to-accent shadow-2xl hover:scale-105 hover:shadow-[0_25px_50px_-12px_rgba(91,45,139,0.4)] transition-all duration-500">
        <img src="images/my-photo.jpg" class="w-full h-full rounded-full object-cover bg-white">
      </div>
    </div>
  </section>


  <!-- CONTACT MODAL -->
  <div id="contact"
    class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center z-50 p-4">
    <div class="bg-white rounded-3xl shadow-2xl max-w-4xl w-full overflow-hidden">
      <div class="flex flex-col md:flex-row">

        <!-- LEFT SIDE - Contact Form -->
        <div class="w-full md:w-1/2 p-8 md:p-12">
          <div class="flex justify-between items-start mb-6">
            <h2 class="text-3xl font-bold text-primary">Contact us</h2>
            <button onclick="closeModal()" class="text-gray-400 hover:text-primary transition">
              <i class="fas fa-times text-2xl"></i>
            </button>
          </div>

          <form id="contactForm" class="space-y-6" onsubmit="handleSubmit(event)">
            <div class="relative">
              <i class="fas fa-user absolute left-4 top-4 text-primary"></i>
              <input type="text" id="userName" placeholder="Name" required
                class="w-full pl-12 pr-4 py-3 rounded-xl bg-blue-50 border-2 border-transparent focus:border-primary focus:bg-white transition outline-none">
            </div>

            <div class="relative">
              <i class="fas fa-envelope absolute left-4 top-4 text-primary"></i>
              <input type="email" id="userEmail" placeholder="Email" required
                class="w-full pl-12 pr-4 py-3 rounded-xl bg-blue-50 border-2 border-transparent focus:border-primary focus:bg-white transition outline-none">
            </div>

            <div class="relative">
              <textarea id="userMessage" placeholder="Message" rows="4" required
                class="w-full px-4 py-3 rounded-xl bg-blue-50 border-2 border-transparent focus:border-primary focus:bg-white transition outline-none resize-none"></textarea>
            </div>

            <button type="submit"
              class="w-full bg-primary hover:bg-purple-700 text-white py-4 rounded-full font-semibold hover:scale-105 hover:shadow-xl transition">
              Send Message
            </button>
          </form>
        </div>

        <!-- RIGHT SIDE - Illustration -->
        <div
          class="w-full md:w-1/2 bg-gradient-to-br from-blue-50 to-purple-50 p-8 md:p-12 flex items-center justify-center">
          <div class="text-center">
            <div class="relative inline-block">
              <div class="w-64 h-64 flex items-center justify-center">
                <i class="fas fa-envelope text-[180px] text-primary/20"></i>
                <div class="absolute inset-0 flex items-center justify-center">
                  <i class="fas fa-paper-plane text-6xl text-accent animate-bounce"></i>
                </div>
              </div>
            </div>
            <p class="mt-6 text-lg text-textgray">Let's start a conversation!</p>
            <div class="mt-6 flex justify-center gap-4">
              <i class="fas fa-phone text-2xl text-primary"></i>
              <i class="fas fa-at text-2xl text-primary"></i>
              <i class="fas fa-map-marker-alt text-2xl text-primary"></i>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>
  <script>
    
    function openModal() {
      document.getElementById('contact').classList.remove('hidden');
    }
    function closeModal() {
      document.getElementById('contact').classList.add('hidden');
    }

    function handleSubmit(event) {
      event.preventDefault();

      // getting values from the form
      const name = document.getElementById('userName').value;
      const email = document.getElementById('userEmail').value;
      const message = document.getElementById('userMessage').value;

      // Kuhaon ang existing rows sa local storage
      let rows = JSON.parse(localStorage.getItem('contactMessages')) || [];

      // I-add ang new row
      rows.push({
        name: name,
        email: email,
        message: message
      });

      // kani kay i-save balik sa local storage
      localStorage.setItem('contactMessages', JSON.stringify(rows));

      // Success message
      alert('Message sent successfully! ✅');

      // Clear ang form
      document.getElementById('contactForm').reset();

    }

    // Magclose sya pag magclick sa outside world hahaha
    document.getElementById('contact').addEventListener('click', function (event) {
      if (event.target === this) {
        closeModal();
      }
    });

    // Magclose by clicking "X" button?:))
    document.addEventListener('keydown', function (event) {
      if (event.key === 'Escape') {
        closeModal();
      }
    });
  </script>
</body>
